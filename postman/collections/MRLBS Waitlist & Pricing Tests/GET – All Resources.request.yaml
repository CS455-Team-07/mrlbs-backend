$kind: http-request
url: http://localhost:8080/api/resources
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const resources = pm.response.json();
      pm.test('Exactly 3 resources', () => pm.expect(resources.length).to.eql(3));
      // store ids for later use
      pm.collectionVariables.set('resource1Id', resources[0].id);
      pm.collectionVariables.set('resource2Id', resources[1].id);
      pm.collectionVariables.set('resource3Id', resources[2].id);
    language: text/javascript
order: 1000
