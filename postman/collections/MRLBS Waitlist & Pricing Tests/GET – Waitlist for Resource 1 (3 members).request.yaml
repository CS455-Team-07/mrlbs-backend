$kind: http-request
url: http://localhost:8080/api/waitlist?resourceId={{resource1Id}}
method: GET
queryParams:
  resourceId: "{{resource1Id}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
