spring:
  datasource:
    url: jdbc:h2:mem:mrlbs-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
mrlbs:
  auth:
    enabled: true
    institutional-domain: iitk.ac.in
  mail:
    from: test@example.org
