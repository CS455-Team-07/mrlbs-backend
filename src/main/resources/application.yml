spring:
  application:
    name: mrlbs-backend
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/mrlbs}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:mrlbs}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:}
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-auth-disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-auth-disabled}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  mail:
    host: ${SPRING_MAIL_HOST:smtp-relay.brevo.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

mrlbs:
  auth:
    enabled: ${AUTH_ENABLED:false}
    institutional-domain: ${INSTITUTIONAL_DOMAIN:iitk.ac.in}
    dev-allow-any-google-domain: ${DEV_ALLOW_ANY_GOOGLE_DOMAIN:false}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  mail:
    from: ${MAIL_FROM:noreply@iitk.ac.in}
  telemetry:
    service-url: ${TELEMETRY_SERVICE_URL:https://resource-telemetry-service.onrender.com}
    timeout-ms: ${TELEMETRY_TIMEOUT_MS:3000}

