spring:
  application:
    name: mrlbs-backend

  profiles:
    default: dev

  datasource:
    url: jdbc:h2:mem:mrlbs
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  logging:
    level:
      org.springframework.boot.autoconfigure.h2: DEBUG
      org.h2: DEBUG

  # Ensure the app listens on the default port
  server:
    port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

mrlbs:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}