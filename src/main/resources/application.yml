spring:
  application:
    name: mrlbs-backend
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/mrlbs}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:mrlbs}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: health,info

mrlbs:
  auth:
    enabled: ${AUTH_ENABLED:true}
    institutional-domain: ${INSTITUTIONAL_DOMAIN:iitk.ac.in}
  mail:
    from: ${MAIL_FROM:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
